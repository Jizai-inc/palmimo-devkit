# Cuts a GitHub Release for a pushed `vX.Y.Z` tag: a draft with
# auto-generated notes (shaped by .github/release.yml), for a maintainer to
# review and publish by hand -- see doc/guides/releasing.md.
#
# This release carries no asset. There is nothing on this repository's tag
# for a device to install: the Palmimo Portal (the thing that used to be
# built and attached here) now lives, and self-updates, from its own
# repository. A palmimo-devkit release exists to
# mark a validated SDK revision with human-readable notes; a user on a
# cloned devkit updates with plain git (fetch + checkout the tag, or pull).
#
# The release is created as a **draft** on purpose: a maintainer reads and
# edits the auto-generated notes and publishes by hand.
#
# A tag with a hyphen (e.g. v1.2.0-rc1) is a pre-release build by SemVer
# convention, so it is created with `--prerelease`. `GET
# .../releases/latest` ignores both drafts and pre-releases, so an rc can
# never become the answer to "what should I be running" for someone who
# just asks for the latest release.
#
# Re-running this workflow for a tag that already has a release (e.g. a
# maintainer re-pushing after fixing something) is idempotent: it does
# nothing when a release for that tag already exists, whether draft or
# published. Once a release has been published, this workflow refuses to
# touch it -- see the "already published" guard below; the maintainer is
# meant to publish a new tag instead of silently replacing a published
# release underneath anyone who may already be relying on it.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Verify the tag points at a commit on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "tag $TAG does not point at a commit on main" >&2
            exit 1
          fi

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            is_draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft)"
            if [ "$is_draft" != "true" ]; then
              echo "release $TAG is already published; publish a new tag instead of replacing it" >&2
              exit 1
            fi
            echo "draft release $TAG already exists; nothing to do"
            exit 0
          fi
          prerelease_flag=()
          case "$TAG" in
            *-*) prerelease_flag=(--prerelease) ;;
          esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --generate-notes --title "$TAG" \
            "${prerelease_flag[@]}"
