<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Palmimo Teleop -- Pilot</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body data-role="pilot">
    <div id="pilot-stage">
      <div id="pilot-video-frame">
        <img id="video-layer" alt="Palmimo head camera feed" />
      </div>

      <div id="controls">
        <div id="dpad-column">
          <div id="dpad">
            <button id="rotate-left" type="button" class="rotate-button">&#8634;</button>
            <button id="dpad-forward" type="button">&#8593;</button>
            <button id="rotate-right" type="button" class="rotate-button">&#8635;</button>
            <button id="dpad-left" type="button">&#8592;</button>
            <span></span>
            <button id="dpad-right" type="button">&#8594;</button>
            <span></span>
            <button id="dpad-backward" type="button">&#8595;</button>
            <span></span>
          </div>
        </div>

        <div id="neck-controls">
          <div id="gesture-buttons">
            <!-- Phosphor Icons (MIT) -- see THIRD_PARTY_NOTICES.md -->

          </div>
          <div id="neck-stick">
            <div id="neck-stick-handle"></div>
          </div>
        </div>
      </div>
    </div>

    <a id="home-link" href="/">Home</a>
    <button id="fullscreen-button" type="button">&#x26F6;</button>
    <div id="view-only-banner" hidden>Someone else is piloting -- view-only.</div>
    <div id="servo-banner" hidden>
      NO SERVO BUS -- running compute-only, the robot will not move. Restart the server after checking the servo
      cable.
    </div>
    <div id="servo-fault-banner" hidden>SERVO FAULT -- the robot loop is failing. Check the servo bus.</div>

    <div id="disconnected-banner" hidden>
      <p>Disconnected.</p>
      <button id="reload-button" type="button">Reload</button>
    </div>
    <script src="/static/app.js"></script>
  </body>
</html>
