schema = 1
name = "teleop"
description = "Drive Palmimo from a phone or laptop browser over WebSocket, with live MJPEG camera video, on the same LAN."
command = ["palmimo-teleop", "--port", "{port}", "--fps", "{fps}", "--gait-speed", "{gait_speed}", "{no_camera}", "{dry_run}"]
url = "http://{host}:{port}/"
devices = ["camera", "motor_display"]

[params.port]
type = "int"
default = 8000
min = 1024
max = 65535
description = "HTTP/WebSocket port the teleop web app is served on."

[params.fps]
type = "int"
default = 60
min = 1
max = 120
description = "Robot control loop rate, in cycles per second."

[params.gait_speed]
type = "float"
default = 0.012
min = 0.001
max = 0.05
description = "How fast the robot walks; higher is faster."

[params.no_camera]
type = "bool"
default = false
flag = "--no-camera"
description = "Disable the head camera video feed."

[params.dry_run]
type = "bool"
default = false
flag = "--dry-run"
description = "Run compute-only, without ever attaching a servo driver."
