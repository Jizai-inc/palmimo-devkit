[project]
name = "palmimo-teleop"
version = "0.1.0"
description = "Web teleoperation example for Palmimo (phone/laptop browser -> WebSocket control + MJPEG video)"
authors = [{ name = "Jizai Inc.", email = "noreply@jizai.ai" }]
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    # Pinned to the 0.1 line of the released PyPI package: this example is a
    # standalone uv project (like a third-party Palmimo app), not a workspace
    # member, so it resolves the SDK from PyPI rather than from ../../packages.
    "palmimo-sdk[hardware,vision]>=0.1.1,<0.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://palmimo.dev"
Repository = "https://github.com/Jizai-inc/palmimo-devkit"
Documentation = "https://docs.palmimo.dev"
Issues = "https://github.com/Jizai-inc/palmimo-devkit/issues"

[project.scripts]
palmimo-teleop = "palmimo_teleop.main:run"

[dependency-groups]
dev = [
    "mypy>=1.8,<3",
    "pytest>=8,<10",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.3,<1",
    "types-PyYAML",
    # starlette.testclient.TestClient (used by tests/test_server.py) requires
    # httpx2 at import time; fastapi/starlette do not declare it as a runtime
    # dependency of the app itself, only of their own test client.
    "httpx2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["palmimo_teleop"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
testpaths = ["tests"]

[tool.coverage.run]
source = ["palmimo_teleop"]


[tool.coverage.report]
# A ratchet, like the root workspace's COVERAGE_FLOOR. Raise it when the real number rises.
fail_under = 85

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [".venv", "__pycache__"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors (PEP-8)
    "W",      # pycodestyle warnings (PEP-8)
    "F",      # Pyflakes (logic error detection)
    "I",      # isort (import ordering)
    "N",      # pep8-naming (naming conventions)
    "UP",     # pyupgrade (update to modern Python syntax)
    "B",      # flake8-bugbear (bug-prone patterns)
    "C4",     # flake8-comprehensions (comprehension optimization)
    "SIM",    # flake8-simplify (code simplification)
    "RUF",    # Ruff-specific rules
    "TID251", # flake8-tidy-imports: banned-api (bans reaching into palmimo_sdk.io)
]
ignore = [
    "E501",   # line-too-long (controlled by line-length instead)
    "E741",   # ambiguous variable name (l, O, I, etc. - allowed in math expressions)
    "E402",   # module-import-not-at-top (allows imports after sys.path manipulation)
    "N806",   # non-lowercase-variable-in-function (allows uppercase matrix variables)
    "B008",   # function-call-in-default-argument (needed for Pydantic, etc.)
    "RUF001", # ambiguous-unicode-character-string (the robot speaks Japanese)
    "RUF002", # ambiguous-unicode-character-docstring (en dash, minus sign, and › in English prose)
    "RUF003", # ambiguous-unicode-character-comment (same typography as docstrings)
]

[tool.ruff.lint.isort]
known-first-party = ["palmimo_sdk", "palmimo_teleop"]
force-single-line = false
lines-after-imports = 2

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"palmimo_sdk.io" = { msg = "palmimo_sdk.io is an internal layer. Import from palmimo_sdk (its public surface) instead." }

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
explicit_package_bases = true
namespace_packages = true
ignore_missing_imports = true
files = ["palmimo_teleop/", "tests/"]
exclude = ["\\.venv"]
