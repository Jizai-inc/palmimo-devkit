[project]
name = "palmimo-wakeword-agent"
version = "0.1.0"
description = "Wake-word voice agent example for Palmimo (Silero VAD + Whisper STT + OpenAI tool-calling)"
authors = [{ name = "Jizai Inc.", email = "noreply@jizai.ai" }]
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "palmimo-sdk[voice,speech,hardware,agent]",
    "numpy>=1.24",
    "onnxruntime>=1.17",
    "openai>=1.40",
    "pydantic-settings>=2.0",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://palmimo.dev"
Repository = "https://github.com/Jizai-inc/palmimo-devkit"
Documentation = "https://docs.palmimo.dev"
Issues = "https://github.com/Jizai-inc/palmimo-devkit/issues"

[project.scripts]
palmimo-wakeword-agent = "palmimo_wakeword_agent.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["palmimo_wakeword_agent"]
