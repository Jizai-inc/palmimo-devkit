schema = 1
name = "wakeword"
description = "One-shot wake-word voice agent: hear the wake word and a command in one breath, execute it, and speak the reply."
command = [
  "palmimo-wakeword-agent",
  "--language",
  "{language}",
  "--command-model",
  "{command_model}",
  "--stt-model",
  "{stt_model}",
  "{no_tts}",
  "--speaker-device",
  "{speaker_device}",
]
devices = ["audio", "motor_display"]

[params.language]
type = "enum"
choices = ["en", "ja"]
default = "en"
description = "Language for speech recognition, the spoken voice, and replies."

[params.command_model]
type = "string"
default = "gemini-3.5-flash-lite"
pattern = "^[A-Za-z0-9][A-Za-z0-9._/-]{0,127}$"
description = "Chat model that plans and executes the spoken command."

[params.stt_model]
type = "string"
default = "gpt-4o-mini-transcribe"
pattern = "^[A-Za-z0-9][A-Za-z0-9._/-]{0,127}$"
description = "Speech-to-text model used to transcribe what was heard."

[params.no_tts]
type = "bool"
default = false
flag = "--no-tts"
description = "Do not speak replies aloud."

[params.speaker_device]
type = "string"
default = "ReSpeaker"
max_length = 64
pattern = "^[A-Za-z0-9][A-Za-z0-9 ._-]{0,63}$"
description = "Output device name (substring match); leave as the default unless using different speaker hardware."

[env.OPENAI_API_KEY]
required = true
description = "OpenAI API key: Whisper speech-to-text transcription always runs against it, unconditionally."
help_url = "https://platform.openai.com/api-keys"

[env.GEMINI_API_KEY]
required = true
description = "Google Gemini API key, needed by the default command model. Not needed if command_model is overridden to a plain OpenAI model."
help_url = "https://aistudio.google.com/apikey"
