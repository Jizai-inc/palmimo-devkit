[project]
name = "palmimo-companion-agent"
version = "0.1.0"
description = "Companion voice agent example for Palmimo (LLM tool-calling + guarded speech routing)"
authors = [{ name = "Jizai Inc.", email = "noreply@jizai.ai" }]
license = "Apache-2.0"
# mediapipe==0.10.18 (see the "opencv-python"/"mediapipe" dependency comment
# below) publishes cp312 wheels only, so this project cannot install on 3.13.
requires-python = ">=3.12,<3.13"
dependencies = [
    "litellm>=1.40",
    "pydantic-settings>=2.0",
    # MicStream (streaming mic capture + GTCRN denoise), int16_to_wav, and the
    # head camera (palmimo_sdk.io.camera), for the speech pipeline's audio
    # source (see palmimo_companion_agent.pipeline.speech) and the capture
    # tool. `agent` is the palmimo_sdk.agent Tool/AgentToolSet layer this
    # agent's own tools (core.tools) build on. `speech` is piper, the default
    # TTS backend; wiring builds a Speaker unconditionally, so it has to be
    # installed even when settings.voice_backend selects another engine.
    # `hardware` is dynamixel-sdk, which DynamixelDriver reaches from inside
    # Palmimo.connect(); hardware defaults to True, so a stock run drives the
    # servo bus. `face` is the FaceDisplay client wiring attaches alongside it.
    # Pinned to the 0.1 line of the released PyPI package: this example is a
    # standalone uv project (like a third-party Palmimo app), not a workspace
    # member, so it resolves the SDK from PyPI rather than from ../../../packages.
    "palmimo-sdk[voice,vision,agent,speech,hardware,face]>=0.1,<0.2",
    "numpy>=1.24",
    # Silero VAD v5 ONNX inference (see palmimo_companion_agent.pipeline.vad), same
    # runtime the wakeword example uses for the same model.
    "onnxruntime>=1.17",
    # main.py's typer CLI and tui.py's Textual front end (see
    # palmimo_companion_agent.main / .pipeline.ui.cli / .pipeline.ui.tui).
    "typer>=0.12",
    "textual>=0.60",
    # The realtime voice session (palmimo_companion_agent.realtime) talks to
    # the OpenAI Realtime API over a websocket.
    "websockets>=14",
    # Resampling for the realtime session's mic upsample and pitch shift.
    "scipy>=1.11",
    # Camera-based reflexes (palmimo_companion_agent.core.vision:
    # WaveDetector / FaceLocator / VisionWatch). A regular dependency, not an
    # extra: hardware=True (the default) builds these unconditionally -- see
    # wiring.py's docstring. mediapipe pinned to 0.10.18 -- newer releases
    # changed the Tasks API this depends on (HandLandmarker / FaceDetector
    # options).
    "opencv-python>=4",
    "mediapipe==0.10.18",
]

[project.urls]
Homepage = "https://palmimo.dev"
Repository = "https://github.com/Jizai-inc/palmimo-devkit"
Documentation = "https://docs.palmimo.dev"
Issues = "https://github.com/Jizai-inc/palmimo-devkit/issues"

[project.scripts]
palmimo-companion-agent = "palmimo_companion_agent.main:run"
palmimo-realtime = "palmimo_companion_agent.realtime.app:main"

[dependency-groups]
dev = [
    "mypy>=1.8,<3",
    "pytest>=8,<10",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.3,<1",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["palmimo_companion_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
testpaths = ["tests"]

[tool.coverage.run]
source = ["palmimo_companion_agent"]

[tool.uv]
# g2p-en declares a dependency on `distance` but never imports it (verified by
# grepping the installed package); `distance` is GPL-2.0, so override g2p-en's
# metadata to drop the unused declaration rather than carry a GPL package in
# the lockfile.
[[tool.uv.dependency-metadata]]
name = "g2p-en"
version = "2.1.0"
requires-dist = ["inflect", "nltk", "numpy"]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [".venv", "__pycache__"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors (PEP-8)
    "W",      # pycodestyle warnings (PEP-8)
    "F",      # Pyflakes (logic error detection)
    "I",      # isort (import ordering)
    "N",      # pep8-naming (naming conventions)
    "UP",     # pyupgrade (update to modern Python syntax)
    "B",      # flake8-bugbear (bug-prone patterns)
    "C4",     # flake8-comprehensions (comprehension optimization)
    "SIM",    # flake8-simplify (code simplification)
    "RUF",    # Ruff-specific rules
    "TID251", # flake8-tidy-imports: banned-api (bans reaching into palmimo_sdk.io)
]
ignore = [
    "E501",   # line-too-long (controlled by line-length instead)
    "E741",   # ambiguous variable name (l, O, I, etc. - allowed in math expressions)
    "E402",   # module-import-not-at-top (allows imports after sys.path manipulation)
    "N806",   # non-lowercase-variable-in-function (allows uppercase matrix variables)
    "B008",   # function-call-in-default-argument (needed for Pydantic, etc.)
    "RUF001", # ambiguous-unicode-character-string (the robot speaks Japanese)
    "RUF002", # ambiguous-unicode-character-docstring (en dash, minus sign, and › in English prose)
    "RUF003", # ambiguous-unicode-character-comment (same typography as docstrings)
]

[tool.ruff.lint.isort]
known-first-party = ["palmimo_sdk", "palmimo_companion_agent"]
force-single-line = false
lines-after-imports = 2

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"palmimo_sdk.io" = { msg = "palmimo_sdk.io is an internal layer. Import from palmimo_sdk (its public surface) instead." }

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
explicit_package_bases = true
namespace_packages = true
ignore_missing_imports = true
files = ["palmimo_companion_agent/", "tests/"]
exclude = ["\\.venv"]

[[tool.mypy.overrides]]
# Tests pass minimal fakes where the app's concrete classes are expected.
# Inside the former shared workspace mypy saw the app package as untyped from
# its tests, so these call sites were never checked; typing the fakes (e.g. as
# Protocols) is what would let these codes back on.
module = ["tests.*"]
disable_error_code = ["arg-type", "attr-defined", "list-item", "method-assign", "misc", "redundant-cast", "return-value", "union-attr", "unused-ignore"]
